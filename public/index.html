<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<base href="/" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Heap Chat</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#4F46E5" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Heap Chat" />
<link rel="stylesheet" href="fonts/fonts.css" />
<link rel="stylesheet" href="vendor/katex/katex.min.css" />
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/views.css" />
<style>
  /* Sidebar collapsed rules are in views.css — no overrides needed here */

  /* ---------- resizable chat ---------- */
  .chat-resize { position: absolute; left: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 25; }
  .chat-resize:hover { background: var(--accent-soft-2); }

  /* ---------- folder picker modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center;
    background: rgba(18,24,34,0.32); backdrop-filter: blur(2px); animation: fadeIn .14s ease; padding: 24px;
  }
  .modal {
    width: 540px; max-width: 100%; max-height: 80vh; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); overflow: hidden; animation: popIn .16s ease;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 14px; border-bottom: 1px solid var(--line); }
  .modal-path { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .modal-body { flex: 1; min-height: 180px; overflow: auto; padding: 8px; }
  .dir-row {
    display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 12px; border-radius: 10px;
    border: none; background: transparent; cursor: pointer; font-family: var(--font-ui);
    font-size: 13.5px; font-weight: 600; color: var(--ink); transition: background .12s;
  }
  .dir-row:hover { background: var(--surface-3); }
  .modal-foot { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line); background: var(--surface-2); }

  /* ---------- markdown in chat bubbles ---------- */
  .md { font-size: 13.5px; line-height: 1.55; word-break: break-word; }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 14px 0 7px; line-height: 1.3; font-weight: 800; letter-spacing: -0.01em; }
  .md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14.5px; } .md h4 { font-size: 13.5px; }
  .md ul, .md ol { margin: 6px 0 10px; padding-left: 20px; }
  .md li { margin: 3px 0; }
  .md li > p { margin: 0; }
  .md a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .md a:hover { text-decoration: underline; }
  .md strong { font-weight: 700; }
  .md code { font-family: var(--font-mono); font-size: 12px; background: rgba(18,24,34,0.06); padding: 1.5px 5px; border-radius: 5px; }
  .md pre { background: #0d1117; border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 9px 0; border: 1px solid var(--line); }
  .md pre code { background: none; padding: 0; font-size: 12px; color: #e6edf3; display: block; line-height: 1.55; white-space: pre; }
  .md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--accent-soft-2); color: var(--ink-2); }
  .md table { border-collapse: collapse; margin: 9px 0; font-size: 12.5px; width: 100%; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; }
  .md th { background: var(--surface-3); font-weight: 700; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .md img { max-width: 100%; border-radius: 8px; }
  .reason-body .md { font-size: 12.5px; }

  /* ---------- text / code file preview ---------- */
  .codeblock {
    margin: 0; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
    color: var(--ink); white-space: pre-wrap; word-break: break-word; tab-size: 2;
  }
  .codeblock code { font-family: inherit; background: none; padding: 0; }

  /* ---------- subfolders in the gallery ---------- */
  .folder-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px; margin-bottom: 26px;
  }
  .folder-card {
    display: flex; align-items: center; gap: 11px; padding: 13px 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    cursor: pointer; font-family: var(--font-ui); font-size: 13.5px; font-weight: 600; color: var(--ink);
    box-shadow: var(--shadow-xs); transition: box-shadow .16s, transform .16s, border-color .16s; text-align: left;
  }
  .folder-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: #dde1e9; }
  .folder-card-ico {
    width: 36px; height: 36px; border-radius: 9px; flex: none; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
  }

  /* ---------- breadcrumb ---------- */
  .crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .crumbs::-webkit-scrollbar { display: none; }
  .crumb-seg {
    border: none; background: transparent; cursor: pointer; font-family: var(--font-ui);
    font-size: 14px; font-weight: 600; color: var(--ink-2); padding: 4px 7px; border-radius: 7px;
    white-space: nowrap; transition: background .12s, color .12s;
  }
  .crumb-seg:hover { background: var(--surface-3); color: var(--ink); }
  .crumb-seg.last { color: var(--ink); font-weight: 700; letter-spacing: -0.01em; }
  .crumb-sep { color: var(--ink-4); flex: none; }

  /* ---------- chat history dropdown ---------- */
  .dd-label { padding: 6px 10px 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .sess-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; cursor: pointer; transition: background .12s; }
  .sess-row:hover { background: var(--surface-3); }
  .sess-row.on { background: var(--accent-soft); }
  .sess-row.on .semi { color: var(--accent); }
  .sess-del { opacity: 0; color: var(--ink-3); flex: none; }
  .sess-row:hover .sess-del { opacity: 1; }

  /* ---------- RAG source citations ---------- */
  .src-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
  .src-label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-4); }
  .src-chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
    color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line);
    padding: 3px 8px; border-radius: 99px; cursor: pointer; transition: all .12s;
  }
  .src-chip:hover { border-color: var(--accent); color: var(--accent); }
  .src-chip-dl {
    display: grid; place-items: center; color: var(--ink-3); text-decoration: none;
    margin-left: 1px; width: 0; overflow: hidden; opacity: 0; transition: width .14s, opacity .14s;
  }
  .src-chip:hover .src-chip-dl { width: 12px; opacity: 1; }
  .src-chip-dl:hover { color: var(--accent); }
  .src-thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .src-thumb {
    position: relative; width: 84px; height: 84px; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    cursor: pointer; background: var(--surface-2); flex: none; transition: border-color .14s, transform .14s;
  }
  .src-thumb:hover { border-color: var(--accent); transform: translateY(-2px); }
  .src-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .src-thumb-dl {
    position: absolute; top: 4px; right: 4px; z-index: 2; width: 20px; height: 20px; border-radius: 6px;
    display: grid; place-items: center; text-decoration: none;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(4px); color: var(--ink-2);
    opacity: 0; transition: opacity .14s, background .14s;
  }
  .src-thumb:hover .src-thumb-dl { opacity: 1; }
  .src-thumb-dl:hover { background: #fff; color: var(--accent); }
  .related-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }

  /* mermaid diagrams + KaTeX math in answers */
  .md .mermaid-rendered { margin: 12px 0; display: flex; justify-content: center; overflow-x: auto; }
  .md .mermaid-rendered svg { max-width: 100%; height: auto; }
  .md .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  .md .katex { font-size: 1.04em; }

  /* composer tool pills (web / research) — ChatGPT/Claude style */
  .tool-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink-2); transition: all .14s; }
  .tool-pill:hover { background: var(--surface-2); border-color: var(--ink-4); color: var(--ink); }
  .tool-pill.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .tool-pill.on:hover { background: var(--accent-soft); border-color: var(--accent); }

  /* jump-to-latest button (appears when scrolled up) */
  .jump-latest { position: absolute; left: 50%; transform: translateX(-50%); bottom: 92px; z-index: 8;
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-md); color: var(--ink-2); animation: popIn .15s ease; }
  .jump-latest:hover { color: var(--ink); border-color: var(--accent); }

  /* web search results in chat: image grid + link cards */
  .rb-imgs, .rb-links { margin: 4px 0 2px; }
  .rb-img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .rb-img { display: block; aspect-ratio: 1; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
  .rb-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .15s; }
  .rb-img:hover img { transform: scale(1.05); }
  .rb-links { display: flex; flex-direction: column; gap: 6px; }
  .rb-link { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); text-decoration: none; transition: border-color .12s, background .12s; }
  .rb-link:hover { border-color: var(--accent); background: var(--surface-2); }
  .rb-link-title { font-size: 13px; font-weight: 700; color: var(--accent); }
  .rb-link-url { font-size: 11px; color: var(--ink-4); }
  .rb-link-snip { font-size: 12px; color: var(--ink-2); line-height: 1.45; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Instagram post preview card */
  .ig-card { margin: 6px 0 2px; max-width: 380px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow-md); }
  .ig-head { display: flex; align-items: center; gap: 6px; padding: 9px 12px; font-size: 12px; font-weight: 700; color: var(--ink-2); border-bottom: 1px solid var(--line); }
  .ig-photo-wrap { position: relative; }
  .ig-photo { display: block; background: var(--surface-2); }
  .ig-photo img { width: 100%; max-height: 380px; object-fit: cover; display: block; }
  /* carousel controls (multi-photo posts) */
  .ig-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; display: grid; place-items: center;
    border: none; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; cursor: pointer; transition: background .12s; }
  .ig-nav:hover { background: rgba(0,0,0,.68); }
  .ig-nav.prev { left: 8px; } .ig-nav.next { right: 8px; }
  .ig-count { position: absolute; top: 8px; right: 10px; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.55);
    color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .02em; }
  .ig-dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
  .ig-dot { width: 6px; height: 6px; padding: 0; border: none; border-radius: 50%; background: rgba(255,255,255,.55); cursor: pointer; transition: background .12s, transform .12s; }
  .ig-dot.on { background: #fff; transform: scale(1.25); }
  .ig-tabs { display: flex; gap: 4px; padding: 8px 10px 0; flex-wrap: wrap; }
  .ig-tab { padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
    font: inherit; font-size: 11.5px; font-weight: 600; color: var(--ink-3); transition: all .12s; }
  .ig-tab:hover { color: var(--accent); border-color: var(--accent); }
  .ig-tab.on { color: #fff; background: var(--accent); border-color: var(--accent); }
  .ig-caption { padding: 10px 12px 4px; font-size: 13.5px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; }
  .ig-tags { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 12px 2px; }
  .ig-tag { font-size: 12px; font-weight: 600; color: var(--accent); }
  .ig-alt { padding: 6px 12px 2px; font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
  .ig-alt b { color: var(--ink-2); }
  .ig-copy { display: inline-flex; align-items: center; gap: 5px; margin: 8px 12px 12px; padding: 5px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-2); transition: all .12s; }
  .ig-copy:hover { color: var(--accent); border-color: var(--accent); }

  /* grounding / trust badge under an answer */
  .ground-badge { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 3px 9px; border-radius: 99px;
    font-size: 11px; font-weight: 700; letter-spacing: .01em; border: 1px solid var(--line); width: fit-content; }
  .ground-badge.ground-ok  { color: #15803d; background: rgba(22,163,74,.08); border-color: rgba(22,163,74,.25); }
  button.ground-badge { cursor: pointer; font-family: inherit; }
  .ground-badge.ground-warn { color: #b45309; background: rgba(217,119,6,.09); border-color: rgba(217,119,6,.28); }
  .ground-badge.ground-warn:hover { background: rgba(217,119,6,.16); }
  .ground-issues { margin-top: 6px; padding: 9px 12px; border: 1px solid rgba(217,119,6,.28); border-radius: 9px; background: rgba(217,119,6,.05); }
  .ground-issues-note { font-size: 11px; font-weight: 600; color: var(--ink-3); margin-bottom: 5px; }
  .ground-issues ul { margin: 0; padding-left: 18px; }
  .ground-issues li { font-size: 12px; color: var(--ink-2); margin: 2px 0; }
  /* value-level provenance: a number traced back to a source row */
  .md .prov { text-decoration: underline dotted var(--accent); text-underline-offset: 2px; cursor: help; }
  .md .prov:hover { background: rgba(79,70,229,.08); border-radius: 3px; }

  /* ---------- rich render blocks (charts / tables from tool data) ---------- */
  .rb-table-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 2px 4px; }
  .rb-csv { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; font: inherit; font-size: 11.5px; font-weight: 600; color: var(--ink-2); transition: all .12s; }
  .rb-csv:hover { color: var(--accent); border-color: var(--accent); }
  .rb-table-wrap { margin: 0 0 2px; border: 1px solid var(--line); border-radius: 10px; overflow: auto; background: var(--surface); }
  .rb-table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .rb-table th, .rb-table td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .rb-table th { background: var(--surface-2); font-weight: 700; color: var(--ink-2); position: sticky; top: 0; }
  .rb-table tr:last-child td { border-bottom: none; }
  .rb-table tbody tr:hover { background: var(--surface-2); }
  .rb-chart { margin: 4px 0 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 7px; }
  .rb-title { font-size: 12px; font-weight: 800; color: var(--ink-2); letter-spacing: -0.01em; margin-bottom: 2px; }
  .rb-hbars { display: flex; flex-direction: column; gap: 7px; }
  .rb-row { display: grid; grid-template-columns: 110px 1fr 76px; align-items: center; gap: 10px; }
  .rb-label { font-size: 11.5px; color: var(--ink-2); }
  .rb-track { position: relative; height: 16px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
  .rb-track.diverging::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .rb-bar { top: 2px; bottom: 2px; background: var(--accent); border-radius: 4px; min-width: 2px; }
  .rb-bar.neg { background: #d9534f; }
  .rb-val { font-size: 11.5px; font-weight: 700; color: var(--ink-2); text-align: right; }
  /* svg charts (vertical bars / line) */
  .rb-svg { width: 100%; height: auto; max-height: 240px; display: block; }
  .rb-svg-val { font-size: 9.5px; font-weight: 700; fill: var(--ink-2); }
  .rb-svg-lab { font-size: 9.5px; fill: var(--ink-4); }
  /* pie / donut */
  .rb-pie { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .rb-pie-svg { width: 150px; height: 150px; flex: none; }
  .rb-legend { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1; }
  .rb-leg { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 7px; font-size: 11.5px; }
  .rb-dot { width: 10px; height: 10px; border-radius: 3px; }
  .rb-leg-lab { color: var(--ink-2); }
  .rb-leg-val { color: var(--ink-3); font-size: 11px; }
  /* KPI stat cards */
  .rb-statwrap { margin: 4px 0 2px; }
  .rb-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .rb-stat { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 9px 11px; display: flex; flex-direction: column; gap: 2px; }
  .rb-stat-v { font-size: 15px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
  .rb-stat-l { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-4); }

  /* ---------- command palette (⌘K) ---------- */
  .cmd { width: 560px; max-width: 92%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); overflow: hidden; animation: popIn .14s ease; display: flex; flex-direction: column; max-height: 64vh; }
  .cmd-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .cmd-input input { flex: 1; border: none; outline: none; background: transparent; font-family: var(--font-ui); font-size: 15px; color: var(--ink); }
  .cmd-input input::placeholder { color: var(--ink-4); }
  .cmd-list { overflow: auto; padding: 6px; }
  .cmd-item { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 10px; cursor: pointer; font-size: 13.5px; }
  .cmd-item.on { background: var(--accent-soft); }
  .cmd-ico { width: 22px; display: grid; place-items: center; flex: none; color: var(--ink-3); }
  .cmd-empty { padding: 24px; text-align: center; color: var(--ink-3); font-size: 13px; }

  /* ---------- per-message actions (copy / regenerate / edit) ---------- */
  .msg-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
  .msg:hover .msg-actions, .msg.user:hover .msg-actions { opacity: 1; }
  .msg.user .msg-actions { justify-content: flex-end; }
  .msg-act {
    display: inline-flex; align-items: center; gap: 4px; border: none; background: transparent; cursor: pointer;
    font-family: var(--font-ui); font-size: 11px; font-weight: 600; color: var(--ink-3);
    padding: 3px 6px; border-radius: 6px; transition: background .12s, color .12s;
  }
  .msg-act:hover { background: var(--surface-3); color: var(--ink); }

  /* ---------- lightbox ---------- */
  .lightbox { position: fixed; inset: 0; z-index: 400; display: flex; align-items: center; justify-content: center;
    background: rgba(8,12,20,0.92); animation: fadeIn .14s ease; }
  .lb-img { max-width: 92vw; max-height: 88vh; object-fit: contain; cursor: zoom-in; border-radius: 6px; box-shadow: var(--shadow-lg); transition: transform .15s; }
  .lb-img.zoom { max-width: none; max-height: none; width: auto; height: 150vh; cursor: zoom-out; }
  .lb-close { position: fixed; top: 18px; right: 18px; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.12); color: #fff; display: grid; place-items: center; }
  .lb-close:hover { background: rgba(255,255,255,0.22); }
  .lb-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.12); color: #fff; display: grid; place-items: center; }
  .lb-nav:hover { background: rgba(255,255,255,0.22); }
  .lb-prev { left: 18px; } .lb-next { right: 18px; }
  .lb-caption { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.85);
    font-size: 12.5px; font-family: var(--font-mono); background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 99px; }

  /* ---------- drag image into chat ---------- */
  .chat { position: relative; }
  .chat-dropzone { position: absolute; inset: 8px; z-index: 30; border: 2px dashed var(--accent); border-radius: var(--radius);
    background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); font-weight: 700; font-size: 13.5px; text-align: center; pointer-events: none; }
  .msg-attach { max-width: 220px; max-height: 160px; border-radius: 12px; margin-bottom: 6px; align-self: flex-end; border: 1px solid var(--line); }
  .attach-preview { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); }
  .attach-preview img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; flex: none; }
  /* multi-image attachment tray in the composer */
  .attach-imgs { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); }
  .attach-thumb { position: relative; width: 48px; height: 48px; flex: none; }
  .attach-thumb img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .attach-thumb-x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; display: grid; place-items: center; padding: 0;
    border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; box-shadow: var(--shadow-md); }
  .attach-thumb-x:hover { color: var(--ink); border-color: var(--accent); }
  .attach-imgs-note { margin-left: 2px; }
  /* multiple images on a sent user message */
  .msg-attach-grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-bottom: 6px; }
  .msg-attach-grid .msg-attach { max-width: 140px; max-height: 140px; margin-bottom: 0; }
  /* inline clickable citation in answer text */
  .md a.cite {
    color: var(--accent); font-weight: 600; text-decoration: none; cursor: pointer;
    background: var(--accent-soft); padding: 0 5px; border-radius: 5px; white-space: nowrap;
  }
  .md a.cite:hover { background: var(--accent-soft-2); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- in-chat model picker ---------- */
  .model-pick {
    display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent;
    cursor: pointer; font-family: inherit; font-size: 12px; color: var(--ink-3);
    padding: 3px 6px; border-radius: 7px; max-width: 100%; transition: background .12s;
  }
  .model-pick:hover { background: var(--surface-3); color: var(--ink-2); }
  .model-pick-badge { font-size: 9.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; }

  /* ---------- image AI-search panel (focus view) ---------- */
  .img-search { margin-top: 14px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .img-search-head { display: flex; align-items: center; gap: 8px; }
  .img-badge { margin-left: auto; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; color: var(--ink-3);
    background: var(--surface-3); padding: 2px 8px; border-radius: 99px; display: inline-flex; align-items: center; gap: 4px; }
  .img-badge.ok { color: var(--good); background: var(--good-soft); }
  .img-desc { margin-top: 10px; padding: 11px 12px; border-radius: 10px; background: var(--surface-2);
    border: 1px solid var(--line-2); font-size: 12.5px; line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; }

  /* ---------- KB delete button + drag-drop ---------- */
  .fcard-del {
    position: absolute; top: 8px; right: 8px; z-index: 3; width: 26px; height: 26px; border-radius: 8px;
    display: grid; place-items: center; border: none; cursor: pointer;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(4px); color: var(--warn);
    box-shadow: var(--shadow-xs); opacity: 0; transition: opacity .15s, background .15s;
  }
  .fcard:hover .fcard-del { opacity: 1; }
  .fcard-del:hover { background: #fff; color: #c0392b; }
  .fcard-dl {
    position: absolute; top: 8px; right: 40px; z-index: 3; width: 26px; height: 26px; border-radius: 8px;
    display: grid; place-items: center; border: none; cursor: pointer; text-decoration: none;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(4px); color: var(--ink-2);
    box-shadow: var(--shadow-xs); opacity: 0; transition: opacity .15s, background .15s;
  }
  .fcard:hover .fcard-dl { opacity: 1; }
  .fcard-dl:hover { background: #fff; color: var(--accent); }
  .gallery-scroll.drag-over { outline: 2px dashed var(--accent); outline-offset: -10px; background: var(--accent-soft); }

  /* ---------- multi-select ---------- */
  .fcard-check {
    position: absolute; top: 8px; left: 8px; z-index: 4; width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center; cursor: pointer; border: 2px solid #fff;
    background: rgba(8,12,20,0.35); color: #fff; opacity: 0; transition: opacity .14s, background .14s;
  }
  .fcard:hover .fcard-check { opacity: 1; }
  .fcard-check.on { opacity: 1; background: var(--accent); border-color: var(--accent); }
  .fcard:hover .kind-badge, .fcard.checked .kind-badge { opacity: 0; }
  .fcard.checked { outline: 2px solid var(--accent); outline-offset: 1px; }
  .batch-bar {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 120;
    display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px;
    background: var(--ink); color: #fff; border-radius: 13px; box-shadow: var(--shadow-lg); animation: fadeUp .2s ease;
  }
  .batch-bar .semi { margin-right: 4px; font-size: 13px; }
  .batch-bar .btn { background: rgba(255,255,255,0.12); border-color: transparent; color: #fff; }
  .batch-bar .btn:hover { background: rgba(255,255,255,0.22); }
  .batch-bar .btn.ghost { background: transparent; }

  /* ---------- sign-in / first-run setup ---------- */
  .auth-wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 24px; }
  .auth-card { width: 360px; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); padding: 26px 26px 22px; display: flex; flex-direction: column; animation: popIn .16s ease; }
  .auth-card .field { display: flex; flex-direction: column; gap: 5px; }

  /* ---------- duplicate finder ---------- */
  .dup-group { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); flex: none; }
  .dup-badge { font-size: 10.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; color: var(--ink-3); background: var(--surface-3); }
  .dup-badge.exact { color: #b45309; background: rgba(217,119,6,.12); }
  .dup-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
  .dup-card { position: relative; flex: none; width: 132px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface-2);
    padding: 0; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; font: inherit; text-align: left; transition: border-color .12s; }
  .dup-card:hover { border-color: var(--ink-4); }
  .dup-card.del { border-color: var(--warn); }
  .dup-card.del img { opacity: .45; }
  .dup-card img { width: 100%; height: 96px; object-fit: cover; display: block; }
  .dup-meta { display: flex; flex-direction: column; gap: 1px; padding: 6px 8px; font-size: 11px; color: var(--ink-2); min-width: 0; }
  .dup-check { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center;
    background: rgba(255,255,255,.9); color: var(--ink-4); box-shadow: var(--shadow-xs); }
  .dup-check.on { background: var(--warn); color: #fff; }

  /* ---------- smart rename ---------- */
  .rename-row { display: flex; align-items: center; gap: 9px; padding: 5px 6px; border-radius: 9px; }
  .rename-row:hover { background: var(--surface-2); }

  /* ---------- main (full-width centered) chat ---------- */
  .chat.chat-main { width: 100%; flex: 1; border-left: none; background: var(--bg); }
  .chat.chat-main .chat-head { background: var(--surface); }
  .chat.chat-main .chat-head, .chat.chat-main .chat-foot {
    max-width: 880px; margin-inline: auto; width: 100%;
  }
  /* full-width scroll (scrollbar at the window edge), content centered via the inner wrapper */
  .chat.chat-main .chat-scroll { width: 100%; }
  .chat.chat-main .chat-inner { max-width: 848px; margin-inline: auto; }
  .chat.chat-main .chat-foot { background: var(--bg); }

  /* ---------- agent step trace ---------- */
  .agent-steps { border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); overflow: hidden; margin-bottom: 2px; }
  .agent-steps-head { display: flex; align-items: center; gap: 8px; padding: 8px 11px; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .agent-steps-body { padding: 4px 6px 7px; border-top: 1px solid var(--line-2); }
  .agent-step { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 8px; font-size: 12.5px; color: var(--ink-2); }
  .agent-step.clickable { cursor: pointer; }
  .agent-step:hover { background: var(--surface-3); }
  .agent-step-detail { margin: 0 7px 6px 30px; }
  .agent-step-args { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); padding: 4px 0 6px; }
  .agent-step-out { margin: 0; max-height: 220px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
  .agent-step-ico { width: 16px; height: 16px; display: grid; place-items: center; flex: none; color: var(--good); }
  .spin-mini { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent-soft-2); border-top-color: var(--accent); animation: spin .7s linear infinite; }
  /* floating export (main chat has no header bar) */
  .chat-export-float { position: absolute; top: 12px; right: 16px; z-index: 6; width: 32px; height: 32px;
    display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
    color: var(--ink-3); cursor: pointer; transition: color .12s, border-color .12s; }
  .chat-export-float:hover { color: var(--ink); border-color: var(--accent); }

  /* Extract-to-table modal */
  .modal-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(18,24,34,.34); display: grid; place-items: center; padding: 24px; animation: fadeIn .12s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .ex-modal { width: 520px; max-width: 94vw; max-height: 88vh; overflow: auto; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow-lg); padding: 18px 20px; animation: popIn .15s ease; display: flex; flex-direction: column; }
  .ex-modal.wide { width: 840px; }
  .ex-input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; font: inherit; font-size: 14px; color: var(--ink); outline: none; }
  .ex-input:focus { border-color: var(--accent); }
  .ex-table-wrap { border: 1px solid var(--line); border-radius: 10px; overflow: auto; background: var(--surface); max-height: 60vh; }

  /* right-side source preview — a split column beside the chat (not an overlay) */
  .source-drawer { flex: none; width: 460px; max-width: 46vw; height: 100%; min-width: 320px;
    background: var(--surface); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; animation: drawerIn .16s ease; }
  @keyframes drawerIn { from { opacity: .4; } to { opacity: 1; } }
  .source-drawer-head { display: flex; align-items: center; gap: 9px; padding: 11px 12px 11px 15px; border-bottom: 1px solid var(--line); flex: none; }
  .source-drawer-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  .source-drawer-body .preview { flex: 1; min-height: 0; }

  /* sidebar: chats list */
  .side-chats { display: flex; flex-direction: column; gap: 1px; }
  .side-chats-search { display: flex; align-items: center; gap: 7px; margin: 9px 0 0; padding: 6px 9px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
  .side-chats-search input { flex: 1; min-width: 0; border: none; outline: none; background: none; font: inherit; font-size: 12.5px; color: var(--ink); }
  .side-chats-clear { border: none; background: none; cursor: pointer; color: var(--ink-4); display: grid; place-items: center; padding: 0; flex: none; }
  .side-chats-clear:hover { color: var(--ink); }
  .side-chats-empty { padding: 3px 10px; font-size: 12px; color: var(--ink-4); }
  .side-chat { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 9px; border: none; background: none;
    border-radius: 8px; cursor: pointer; font: inherit; font-size: 12.5px; color: var(--ink-2); text-align: left; transition: background .12s; }
  .side-chat:hover { background: var(--surface-2); color: var(--ink); }
  .side-chat .truncate { min-width: 0; }
  .side-chat-all { font-size: 11.5px; font-weight: 600; color: var(--ink-3); justify-content: flex-start; }
  .side-chat-del { opacity: 0; margin-left: auto; flex: none; display: grid; place-items: center; color: var(--ink-4); border-radius: 5px; padding: 2px; }
  .side-chat:hover .side-chat-del { opacity: 1; }
  .side-chat-del:hover { color: var(--warn); background: var(--surface-3); }
  .sidebar.collapsed .side-chats-search, .sidebar.collapsed .side-chat, .sidebar.collapsed .side-chats-empty { display: none; }

  /* Chats hub */
  .chats-search { display: flex; align-items: center; gap: 9px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface); max-width: 640px; margin: 0 auto 16px; }
  .chats-search input { flex: 1; border: none; outline: none; background: none; font: inherit; font-size: 14px; color: var(--ink); }
  .chats-list { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .chat-card { display: flex; align-items: flex-start; gap: 11px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface); cursor: pointer; transition: border-color .12s, background .12s; }
  .chat-card:hover { border-color: var(--accent); background: var(--surface-2); }
  .chat-card-actions { display: none; gap: 1px; flex: none; }
  .chat-card:hover .chat-card-actions { display: flex; }
  .chat-rename { border: 1px solid var(--accent); border-radius: 6px; padding: 2px 7px; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); outline: none; width: 100%; }

  /* ---- projects ---- */
  .sidebar.collapsed .proj-nav-item { display: none; }
  .proj-nav-item { gap: 8px; }
  .proj-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .proj-dot-sm { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .proj-modal { width: 520px; max-width: 94vw; max-height: 92vh; overflow: auto; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px 24px; box-shadow: 0 8px 40px rgba(0,0,0,.18); }
  .proj-swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .proj-swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: border-color .12s; padding: 0; }
  .proj-swatch.on { border-color: var(--ink); }
  .proj-icon-btn { width: 28px; height: 28px; border-radius: 7px; border: 1.5px solid transparent; background: var(--surface-2); cursor: pointer;
    display: grid; place-items: center; transition: border-color .12s, color .12s; }
  .proj-icon-btn.on { border-color: currentColor; background: var(--surface-3); }
  .proj-tabs { display: flex; align-items: center; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex: none; }
  .proj-tab { display: flex; align-items: center; gap: 6px; padding: 10px 12px; font-size: 13px; font-weight: 500; color: var(--ink-3);
    background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: color .12s, border-color .12s; margin-bottom: -1px; }
  .proj-tab:hover { color: var(--ink); }
  .proj-tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .proj-tab-count { font-size: 11px; font-weight: 700; background: var(--surface-3); color: var(--ink-3); border-radius: 99px; padding: 1px 6px; }
  .proj-file-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; }
  .proj-file-row:hover { background: var(--surface-2); }

  /* ---- custom agents ---- */
  .agent-modal { width: 560px; max-width: 95vw; max-height: 92vh; overflow: auto; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px 24px; box-shadow: 0 8px 40px rgba(0,0,0,.18); }
  .agent-tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .agent-toggle { display: flex; align-items: flex-start; gap: 10px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .agent-toggle:hover { background: var(--surface-2); }
  .agent-toggle .toggle { flex: none; margin-top: 1px; }
  .agent-pick-wrap { position: relative; }
  .agent-pick { display: inline-flex; align-items: center; gap: 6px; max-width: 200px; padding: 5px 9px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--surface); cursor: pointer; font: inherit; font-size: 12.5px; color: var(--ink); }
  .agent-pick:hover { border-color: var(--accent); }
  .agent-pick-name { font-weight: 600; min-width: 0; }
  .agent-pick-menu { top: auto; bottom: calc(100% + 6px); left: 0; right: auto; min-width: 220px; max-height: 320px; overflow: auto; }
  .agent-nav-item { gap: 7px; }
  .agent-nav-item:hover .side-chat-del { opacity: 1; }   /* reveal the edit pencil on hover (the row isn't a .side-chat) */
  .agent-nav-item .side-chat-del:hover { color: var(--accent); }   /* edit = accent, not the red delete colour */

  /* ---- first-run setup ---- */
  .setup-screen { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(at 30% 20%, var(--accent-soft) 0, transparent 55%), var(--bg); overflow: auto; }
  .setup-card { width: 520px; max-width: 94vw; background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 30px 32px; box-shadow: 0 12px 50px rgba(0,0,0,.18); }
  .setup-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 22px; }
  .setup-title { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 8px; }
  .setup-sub { color: var(--ink-2); font-size: 13.5px; line-height: 1.6; margin: 0 0 6px; }
  .setup-steps { margin: 14px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 13px; line-height: 1.9; }
  .setup-models { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .setup-model { text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 11px 13px;
    border: 1.5px solid var(--line); border-radius: 11px; background: var(--surface); cursor: pointer; transition: border-color .12s, background .12s; }
  .setup-model:hover { background: var(--surface-2); }
  .setup-model.on { border-color: var(--accent); background: var(--accent-soft); }
  .setup-badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 2px 8px; }
  .setup-progress { margin-top: 16px; }
  .setup-bar { height: 9px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
  .setup-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
  .setup-check { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; background: var(--good, #1e8a5b); }
  .setup-skip { display: block; margin: 18px auto 0; background: none; border: none; color: var(--ink-3);
    font: inherit; font-size: 12.5px; cursor: pointer; text-decoration: underline; }
  .setup-skip:hover { color: var(--ink); }

  /* ---- Quick Ask panel (frameless, transparent ?quick window) ----
     Floating popover using the app's own theme vars (app.css :root) — same warm-paper surface,
     ink, and accent as the main window, just in a compact popover shell. Every rule below reads
     the shared vars (var(--ink), var(--accent), …) rather than hardcoding colors, so it stays in
     sync with the app's theme automatically. */
  html:has(.quick-wrap), html:has(.quick-wrap) body { background: transparent; }
  .quick-wrap {
    display: flex; flex-direction: column; width: 100%; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-lg); overflow: hidden;
  }
  .quick-head { -webkit-app-region: drag; }
  .quick-nodrag, .quick-head button, .quick-head textarea { -webkit-app-region: no-drag; }
  .quick-bar { display: flex; align-items: center; gap: 11px; padding: 13px 14px; }
  .quick-badge {
    flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff;
    background: linear-gradient(150deg, var(--accent), var(--accent-deep)); box-shadow: var(--shadow-sm);
  }
  .quick-bar textarea { flex: 1; min-width: 0; border: none; outline: none; resize: none; background: none;
    font: inherit; font-size: 15.5px; color: var(--ink); max-height: 90px; line-height: 1.4; }
  .quick-bar textarea::placeholder { color: var(--ink-3); }
  .quick-newchat { display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 6px 9px; border: none;
    border-radius: 8px; background: transparent; color: var(--ink-2); font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .quick-newchat:hover { background: var(--surface-2); color: var(--ink); }
  .quick-submit { flex: none; width: 32px; height: 32px; border-radius: 50%; border: none; display: grid; place-items: center;
    background: var(--accent); color: #fff; cursor: pointer; transition: background .12s, transform .06s; }
  .quick-submit:hover:not(:disabled) { background: var(--accent-hover); }
  .quick-submit:active:not(:disabled) { transform: scale(.94); }
  .quick-submit:disabled { opacity: .35; cursor: default; }
  .quick-dd { top: calc(100% + 6px); left: auto; right: 0; width: 190px; }
  .dd-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: none; border-radius: 8px;
    background: none; color: var(--ink-2); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .dd-item:hover { background: var(--surface-2); color: var(--ink); }
  .quick-share { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    padding: 12px 14px; border-top: 1px solid var(--line); }
  .quick-share-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .quick-share-title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .quick-share-sub { font-size: 11.5px; color: var(--ink-3); }
  .quick-share-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .quick-pill { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent;
    color: var(--ink-2); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; transition: border-color .12s, background .12s, color .12s; }
  .quick-pill:hover { border-color: var(--ink-4); background: var(--surface-2); color: var(--ink); }
  .quick-body { max-height: 360px; overflow: auto; padding: 14px; border-top: 1px solid var(--line); }
  .quick-body .md { font-size: 13.5px; line-height: 1.6; }
  .quick-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 100%;
    text-align: center; color: var(--ink-3); font-size: 13px; padding: 0 24px; }
  .quick-empty kbd { font-family: inherit; background: var(--surface-3); border-radius: 5px; padding: 1px 6px; font-size: 11px; }
  .quick-continue { -webkit-app-region: no-drag; display: inline-flex; align-items: center; gap: 5px; margin-top: 14px; padding: 6px 11px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font: inherit; font-size: 12.5px; cursor: pointer; }
  .quick-continue:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- photo map ---- */
  .photo-map { position: absolute; inset: 0; height: 100%; width: 100%; background: var(--surface-2); }
  .photo-map .leaflet-container { font: inherit; background: var(--surface-2); }
  .map-pop { width: 180px; }
  .map-pop img { width: 180px; height: 130px; object-fit: cover; border-radius: 8px; display: block; }
  .map-pop-name { font-size: 12px; font-weight: 600; margin-top: 6px; word-break: break-word; color: #1a2230; }
  .map-pop-date { font-size: 11px; color: #6b7686; margin-top: 1px; }
  .leaflet-popup-content { margin: 10px; }
  .leaflet-popup-content-wrapper { border-radius: 12px; }

  /* ---- people albums ---- */
  .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
  .person-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface); cursor: pointer; transition: border-color .12s, background .12s; }
  .person-card:hover { border-color: var(--accent); background: var(--surface-2); }
  .face-thumb { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; background: var(--surface-3); }
  .person-face { cursor: pointer; }
  .person-name-input { width: 100%; text-align: center; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
    font: inherit; font-size: 13px; font-weight: 600; background: none; color: var(--ink); outline: none; }
  .person-name-input:hover { border-color: var(--line); }
  .person-name-input:focus { border-color: var(--accent); background: var(--surface); }
  .person-name-input::placeholder { color: var(--ink-4); font-weight: 500; }
  .person-count { font-size: 11.5px; color: var(--ink-3); }
  .people-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .people-photo { padding: 0; border: none; background: var(--surface-3); border-radius: 10px; overflow: hidden; cursor: pointer; aspect-ratio: 1; }
  .people-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .manage-person { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
  .manage-person .person-name-input { text-align: left; flex: 1; }
  /* lightbox with per-image face assignment */
  .lb-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(10,14,20,.82); display: grid; place-items: center; padding: 24px; }
  .lb-box { background: var(--surface); border-radius: 16px; overflow: hidden; max-width: 92vw; max-height: 92vh; display: flex; flex-direction: column; position: relative; }
  .lb-close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: none;
    background: rgba(0,0,0,.5); color: #fff; cursor: pointer; display: grid; place-items: center; }
  .lb-photo { max-width: 92vw; max-height: 64vh; object-fit: contain; background: #000; display: block; }
  .lb-faces { padding: 14px 16px; border-top: 1px solid var(--line); }
  .lb-face-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .lb-face { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 84px; }
  .lb-face .face-thumb { width: 64px; height: 64px; }
  .lb-face .person-name-input { width: 84px; text-align: center; }

  /* interleaved reasoning + tool steps — flat, minimal expandable trace (Claude-web style, no boxed bars) */
  .agent-timeline { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; margin: 2px 0 6px; width: 100%; }
  .agent-timeline > .think-seg { width: auto; max-width: 100%; }
  .agent-timeline .agent-step-wrap { border: none; background: none; border-radius: 0; overflow: visible; margin: 0; width: auto; max-width: 100%; }
  /* compact clickable header — fits its text, so the hover highlight + chevron hug the label */
  .trace-head { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 6px; border: none; border-radius: 7px;
    background: none; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 500; color: var(--ink-3); transition: color .12s; }
  .trace-head:hover { color: var(--ink); }
  .agent-timeline .agent-step { padding: 3px 6px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-3); background: none; transition: color .12s; }
  .agent-timeline .agent-step:hover { color: var(--ink); background: none; }
  /* expanded bodies: indented, readable, thin rail instead of a card */
  .trace-body { margin: 2px 0 6px 11px; padding: 2px 0 2px 13px; border-left: 2px solid var(--line); color: var(--ink-2); font-size: 12.5px; line-height: 1.6; }
  .trace-body .md, .trace-body .md p, .trace-body .md li { font-size: 12.5px; color: var(--ink-2); }
  .agent-timeline .agent-step-detail { margin: 1px 0 6px 24px; }
</style>
