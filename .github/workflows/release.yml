name: Release

# Builds the desktop installers on a version tag and uploads them to the GitHub
# release. Windows is the real reason this exists: electron-builder can't produce
# a proper NSIS installer from macOS, so Windows builds are only practical here.
#
# Usage:
#   1. bump "version" in package.json, commit, merge to main
#   2. git tag v1.1.0 && git push origin v1.1.0
#   3. electron-builder uploads to a DRAFT release — review the assets, then publish
#
# SIGNING: these builds are unsigned. macOS users get a Gatekeeper warning
# (right-click → Open), Windows users get SmartScreen. More importantly,
# electron-updater will NOT apply updates to an unsigned macOS app, so
# auto-update stays inert until a Developer ID cert is added as a secret.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to the GitHub release. Leave OFF to build only — installers come back as run artifacts instead."
        type: boolean
        default: false

permissions:
  contents: write   # electron-builder uploads installers to the release

jobs:
  dist:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false   # a Windows failure shouldn't throw away a finished macOS build
      matrix:
        include:
          - os: macos-latest
            name: macOS (arm64 + x64)
            flag: --mac
          - os: windows-latest
            name: Windows (x64)
            flag: --win
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # electron-builder names artifacts and writes the electron-updater feed from
      # package.json's version, NOT from the tag. A mismatch produces a release whose
      # assets claim a different version than the tag they hang off — fail loudly instead.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg — bump the version before tagging"
            exit 1
          fi

      - run: npm ci

      # `npm run dist` would run this via predist, but we call electron-builder
      # directly below to pass the per-platform flag, which skips the pre-script.
      - name: Build UI bundle
        run: npm run build:ui

      # A tag push always publishes. A manual run only publishes if you tick the box:
      # electron-builder resolves the target release from package.json's version, so an
      # untick-by-default manual run can't accidentally push assets into an already-published
      # release that happens to match the current version.
      - name: Build installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There's no signing certificate in CI. Without this, electron-builder
          # searches an empty keychain and can fail the build outright rather than
          # falling back to producing an unsigned app. See the SIGNING note above.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: npx electron-builder ${{ matrix.flag }} --publish ${{ (github.event_name == 'push' || inputs.publish) && 'always' || 'never' }}

      # build-only run: hand the installers back so they can actually be downloaded and
      # opened. if-no-files-found: error turns "built nothing" into a failure rather than
      # a green run with an empty artifact.
      - name: Upload installers
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 7
