name: Deploy site

# Publishes website/ to Cloudflare Pages. The site is a zero-build static folder —
# no npm install, no bundler — so this is a plain upload.
#
# Setup (one time):
#   Repo secret    CLOUDFLARE_API_TOKEN     token with the "Cloudflare Pages — Edit" permission
#   Repo secret    CLOUDFLARE_ACCOUNT_ID    Cloudflare dashboard → Workers & Pages → Account ID
#   Repo variable  CF_PAGES_PROJECT         the Pages project name (not the domain)

on:
  # ordinary content edits
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-site.yml'

  # Publishing a release is the moment /releases/latest starts resolving to the new
  # version, which is what the site's download buttons point at. Redeploying here keeps
  # the two in lockstep: without it, publishing a release leaves the live site pointing
  # at the previous version's filenames, which no longer exist in the newest release —
  # so every download button 404s until someone remembers to redeploy by hand.
  release:
    types: [published]

  workflow_dispatch:

# One deploy at a time. cancel-in-progress stays false deliberately: an upload that's
# already talking to Cloudflare should finish rather than leave a half-published state.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Fail with an explanation rather than letting wrangler error out on an empty
      # --project-name, which reads as a wrangler bug rather than missing config.
      - name: Check deploy config is present
        run: |
          missing=""
          [ -n "${{ vars.CF_PAGES_PROJECT }}" ]        || missing="$missing CF_PAGES_PROJECT(variable)"
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(secret)"
          if [ -n "$missing" ]; then
            echo "Missing repo config:$missing"
            echo "See the setup comment at the top of .github/workflows/deploy-site.yml"
            exit 1
          fi

      # --branch is what tells Pages this is a production deploy rather than a preview;
      # it has to match the project's configured production branch.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
