name: Deploy site

# Publishes website/ to Cloudflare Pages. Zero-build static folder — no install,
# no bundler — so this is a plain upload.
#
# Setup: two repo secrets.
#   CLOUDFLARE_API_TOKEN    "Cloudflare Pages — Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   dashboard → Workers & Pages → Account ID
#
# The account ID is passed explicitly rather than discovered. Without it wrangler
# calls /memberships to work out which account to deploy to, which needs User →
# Memberships → Read on the token — a permission a Pages-scoped token doesn't carry,
# and the first deploy failed on exactly that ("Authentication error [code: 10000]").
# heapcode's equivalent workflow gets away with token-only because its token is scoped
# more broadly; naming the account here means this doesn't depend on how the token
# happens to be scoped.

on:
  # ordinary content edits
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-site.yml'

  # Fires only for a release published BY A PERSON. It did not fire for v1.1.0 and never will
  # for a release release.yml creates: electron-builder publishes using GITHUB_TOKEN, so GitHub
  # attributes the release to github-actions[bot], and events attributed to GITHUB_TOKEN
  # deliberately do not start workflow runs (anti-recursion). The ReleaseEvent is emitted — it
  # just starts nothing. Making this fire would mean publishing with a PAT instead.
  #
  # Left in place because it does work for a hand-created release, but it is NOT the safety net
  # it looks like. What actually decoupled the site from release timing is build.artifactName in
  # package.json: artifact names carry no version (Heap-Chat-mac-arm64.dmg), so
  # /releases/latest/download/<name> keeps resolving across releases and the site's links don't
  # need to change when a new version ships. The one time this mattered was the v1.0.0 → v1.1.0
  # rename, where the old links pointed at filenames the new release didn't contain.
  release:
    types: [published]

  # lets a stale site be redeployed without an empty commit
  workflow_dispatch:

# One deploy at a time. cancel-in-progress stays false deliberately: an upload already
# talking to Cloudflare should finish rather than leave a half-published state.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # No `if: secrets... != ''` guard, matching heapcode's reasoning: a guard that
      # SKIPS on a missing token makes the run look green while nothing deployed. A
      # missing token should fail loudly here instead.
      #
      # --branch is what marks this a production deploy rather than a preview; it has
      # to match the Pages project's configured production branch.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=heapchat --branch=main

      # A failed deploy reports the same "Authentication error [code: 10000]" whether the
      # project name is wrong or the token can't see Pages at all, which is not enough to
      # act on. Listing the projects separates the two: a list means the name is wrong and
      # the real ones are right there; another auth error means it's the token's permissions.
      - name: Diagnose failure
        if: failure()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project list
